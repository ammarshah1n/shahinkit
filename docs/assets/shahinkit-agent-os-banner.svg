    <filter id="shadow" x="52" y="62" width="1176" height="356" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1280" height="480" rx="0" fill="url(#bg)"/>
  <path d="M0 405C181 346 267 428 439 372C616 314 674 183 858 150C1000 124 1121 154 1280 95V480H0V405Z" fill="#00C9A7" opacity="0.08"/>
  <path d="M0 86C176 143 315 51 493 98C672 146 744 253 924 274C1068 291 1172 234 1280 256V0H0V86Z" fill="#FF6B6B" opacity="0.09"/>

