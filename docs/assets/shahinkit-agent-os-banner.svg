<svg width="1280" height="480" viewBox="0 0 1280 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ShahinKit agent operating system banner</title>
  <desc id="desc">A dark editorial banner for ShahinKit showing Claude Code and OpenAI Codex connected to memory, planning, handoff, and opt-in indexing workflows.</desc>
  <defs>
