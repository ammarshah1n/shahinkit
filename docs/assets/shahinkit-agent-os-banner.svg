      <stop offset="0.52" stop-color="#101821"/>
      <stop offset="1" stop-color="#071C18"/>
    </linearGradient>
    <linearGradient id="panel" x1="84" y1="92" x2="1196" y2="390" gradientUnits="userSpaceOnUse">
