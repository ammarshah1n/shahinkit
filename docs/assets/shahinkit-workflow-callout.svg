<svg width="1280" height="260" viewBox="0 0 1280 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ShahinKit workflow callout</title>
  <desc id="desc">A compact workflow banner showing ShahinKit moving from cold start to plan, memory, consent, and handoff.</desc>
  <defs>
    <linearGradient id="calloutBg" x1="0" y1="0" x2="1280" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0D12"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#081B18"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="260" rx="28" fill="url(#calloutBg)"/>
  <rect x="28" y="28" width="1224" height="204" rx="22" fill="#0D121A" stroke="#263241"/>

  <text x="64" y="82" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">Cold start goes in. Finished handoff comes out.</text>
  <text x="66" y="121" fill="#AAB6C2" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">A practical runbook for Claude Code, OpenAI Codex, Obsidian, local memory, and opt-in indexing.</text>

