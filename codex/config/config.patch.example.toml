# Project config fragment for Codex CLI 0.145.0. Merge only after review.
# This fragment deliberately sets no global model, approval, sandbox, network,
# provider, credential, telemetry, or trust controls.

[agents.controller]
description = "Controller: final synthesis and acceptance."
config_file = "agents/controller.toml"

[agents.research]
description = "Research: bounded current-fact and source work."
config_file = "agents/research.toml"

[agents.implementation]
description = "Implementation: exact bounded changes and checks."
config_file = "agents/implementation.toml"

[agents.review]
description = "Review: independent critique and verification."
config_file = "agents/review.toml"

[agents.mechanical]
description = "Mechanical: deterministic extraction and formatting."
config_file = "agents/mechanical.toml"

# Basic Memory stays disabled unless reviewed local setup opts in.
[mcp_servers.basic-memory]
command = "basic-memory"
args = ["mcp", "--transport", "stdio", "--project", "<LOCAL_PROJECT_NAME>"]
enabled = false

[mcp_servers.basic-memory.env]
BASIC_MEMORY_CONFIG_DIR = "<LOCAL_BASIC_MEMORY_CONFIG_DIR>"
BASIC_MEMORY_DEFAULT_PROJECT = "<LOCAL_PROJECT_NAME>"
BASIC_MEMORY_PROJECT_ROOT = "<LOCAL_PROJECT_ROOT>"
BASIC_MEMORY_FORCE_LOCAL = "true"
BASIC_MEMORY_EXPLICIT_ROUTING = "true"
BASIC_MEMORY_AUTO_UPDATE = "false"
BASIC_MEMORY_LOGFIRE_ENABLED = "false"
BASIC_MEMORY_LOGFIRE_SEND_TO_LOGFIRE = "false"
BASIC_MEMORY_CLOUD_PROMO_OPT_OUT = "true"
