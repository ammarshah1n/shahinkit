<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">ShahinKit capabilities</title>
  <desc id="desc">Six illustrated ShahinKit capabilities: human or dev explanations, subscription-aware rosters, specialist agents, concise output, token discipline, and durable handoffs.</desc>
  <rect width="1440" height="600" fill="#F3F0E7"/>

  <g fill="none" stroke="#D8D9CF" stroke-width="1.5">
    <rect x="72" y="42" width="416" height="232"/>
    <rect x="512" y="42" width="416" height="232"/>
    <rect x="952" y="42" width="416" height="232"/>
    <rect x="72" y="290" width="416" height="232"/>
    <rect x="512" y="290" width="416" height="232"/>
    <rect x="952" y="290" width="416" height="232"/>
  </g>

  <!-- Human or dev: paired explanation lanes, with the dev lane accented. -->
  <g fill="none" stroke="#191B18" stroke-width="2.5" stroke-linecap="square">
    <path d="M100 77h13v38h-13M160 77h13v38h-13"/>
    <path d="M121 87h22M121 96h15M121 105h22"/>
  </g>
  <rect x="136" y="92" width="7" height="7" fill="#DFFF70"/>
  <text x="100" y="160" fill="#191B18" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="-0.5">Human or dev</text>
  <text x="100" y="196" fill="#69705D" font-family="Arial, Helvetica, sans-serif" font-size="16">Explanations at your level.</text>

  <!-- Your subscriptions: one source feeding an intentionally small roster. -->
  <g fill="none" stroke="#191B18" stroke-width="2.5">
    <rect x="540" y="77" width="22" height="22"/>
    <path d="M562 88h21M583 88v-14h17M583 88h17M583 88v14h17"/>
  </g>
  <circle cx="605" cy="74" r="5" fill="#DFFF70" stroke="#191B18" stroke-width="2"/>
  <circle cx="605" cy="88" r="5" fill="#F3F0E7" stroke="#191B18" stroke-width="2"/>
  <circle cx="605" cy="102" r="5" fill="#F3F0E7" stroke="#191B18" stroke-width="2"/>
  <text x="540" y="160" fill="#191B18" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="-0.5">Your subscriptions</text>
  <text x="540" y="196" fill="#69705D" font-family="Arial, Helvetica, sans-serif" font-size="16">A roster that fits what you pay for.</text>

  <!-- Specialist agents: a framed worker with distinct task bars. -->
  <g fill="none" stroke="#191B18" stroke-width="2.5" stroke-linecap="square">
    <path d="M980 77h-9v38h9M1031 77h9v38h-9"/>
    <path d="M991 85h27M991 96h19M991 107h27"/>
  </g>
  <rect x="1012" y="92" width="7" height="7" fill="#DFFF70"/>
  <text x="980" y="160" fill="#191B18" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="-0.5">Specialist agents</text>
  <text x="980" y="196" fill="#69705D" font-family="Arial, Helvetica, sans-serif" font-size="16">Give each job the right worker.</text>

  <!-- Ponytail + Caveman: a deliberate cut through excess. -->
  <g fill="none" stroke="#191B18" stroke-width="2.5" stroke-linecap="square">
    <path d="M100 329h54M100 343h38M100 357h54"/>
    <path d="M166 325l-12 18h11l-7 18 20-24h-12l7-12"/>
  </g>
  <rect x="147" y="340" width="7" height="7" fill="#DFFF70"/>
  <text x="100" y="408" fill="#191B18" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="-0.5">Ponytail + Caveman</text>
  <text x="100" y="444" fill="#69705D" font-family="Arial, Helvetica, sans-serif" font-size="16">Less overbuilding. Less waffle.</text>

  <!-- Token discipline: a compact stack kept within clear bounds. -->
  <g fill="none" stroke="#191B18" stroke-width="2.5">
    <rect x="540" y="326" width="52" height="38"/>
    <path d="M550 336h32M550 345h22M550 354h32"/>
  </g>
  <rect x="575" y="342" width="7" height="7" fill="#DFFF70"/>
  <text x="540" y="408" fill="#191B18" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="-0.5">Token discipline</text>
  <text x="540" y="444" fill="#69705D" font-family="Arial, Helvetica, sans-serif" font-size="16">Small context. Bounded work.</text>

  <!-- Pick up tomorrow: a saved state carried into the next day. -->
  <g fill="none" stroke="#191B18" stroke-width="2.5" stroke-linecap="square">
    <path d="M980 338h47M980 350h32"/>
    <path d="M1042 328v31M1030 344h24"/>
  </g>
  <circle cx="1042" cy="344" r="20" fill="none" stroke="#191B18" stroke-width="2.5"/>
  <rect x="1038" y="340" width="8" height="8" fill="#DFFF70"/>
  <text x="980" y="408" fill="#191B18" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="-0.5">Pick up tomorrow</text>
  <text x="980" y="444" fill="#69705D" font-family="Arial, Helvetica, sans-serif" font-size="16">State and handoffs that survive.</text>

  <path d="M72 554H1368" stroke="#D8D9CF" stroke-width="1.5"/>
  <text x="72" y="581" fill="#69705D" font-family="Arial, Helvetica, sans-serif" font-size="13">Workflow illustration — capabilities vary by host.</text>
</svg>
