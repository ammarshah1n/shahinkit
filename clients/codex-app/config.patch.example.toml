# Example Codex config fragment. Review before merging into a live config file.

[profiles.shahinkit]
model = "gpt-5.5"
reasoning_effort = "high"
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[projects."{{PROJECT_ROOT}}"]
trust_level = "trusted"

[projects."{{PROJECT_ROOT}}".env]
SHAHINKIT_PROJECT_ROOT = "{{PROJECT_ROOT}}"
SHAHINKIT_HOME = ".shahinkit"
SHAHINKIT_TRACK = "default"
